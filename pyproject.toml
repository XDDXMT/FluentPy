[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluentpy-qt"
version = "0.7.1"
description = "Independent MIT-licensed Fluent-inspired UI toolkit for Qt for Python."
readme = "README-PyPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "性邓的小馒头" }
]
keywords = ["qt", "pyside6", "fluent", "widgets", "desktop"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://fluentpy.mcxmcl.cn/"
Documentation = "https://fluentpy.mcxmcl.cn/"
Repository = "https://github.com/XDDXMT/FluentPy"
Issues = "https://github.com/XDDXMT/FluentPy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluentpy = ["assets/**/*.svg", "assets/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
