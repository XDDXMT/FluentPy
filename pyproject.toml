[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "fluentpy"
version = "0.1.0"
description = "Independent MIT-licensed Fluent-inspired UI toolkit for Qt for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "性邓的小馒头" }
]
keywords = ["qt", "pyside6", "fluent", "widgets", "desktop"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/XDDXMT/FluentPy"
Repository = "https://github.com/XDDXMT/FluentPy"
Issues = "https://github.com/XDDXMT/FluentPy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fluentpy"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/tests", "/docs", "/licenses", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/README.md", "/pyproject.toml", "/.editorconfig", "/.gitattributes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
